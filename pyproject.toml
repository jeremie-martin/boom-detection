[project]
name = "boom-detection"
version = "0.1.0"
description = "Predicting critical transition frames in chaotic double pendulum simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pyqt6>=6.10.1",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ml = [
    # ML framework
    "torch>=2.0",
    # ML utilities
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",  # Explicitly include for model serialization
]
# Convenience: install everything
all = [
    "boom-detection[dev,ml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boom_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
